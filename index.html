<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mosaico Bliar — Loja Oficial</title>
  <meta name="description" content="Mosaico Bliar. Escolha cor e numeração, calcule o frete por CEP e finalize sua compra com segurança pelo Mercado Pago.">
  <link rel="canonical" href="https://appbliar.com.br/">
  <style>
    :root {
      --black: #0a0a0c;
      --black-2: #121216;
      --black-3: #1b1b21;
      --gold: #dfb63f;
      --gold-bright: #f2cb4b;
      --white: #ffffff;
      --light-bg: #f5f5f7;
      --text-dark: #141418;
      --text-muted: #6b6b76;
      --border-dark: #2a2a33;
      --wa-green: #25d366;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--light-bg);
      color: var(--text-dark);
      padding-bottom: 84px;
    }

    .top-promo {
      background: var(--black);
      color: var(--white);
      padding: 8px 14px;
      font-size: 0.78rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .top-promo strong { color: var(--gold-bright); }

    .shipping-strip {
      background: var(--gold);
      color: var(--black);
      text-align: center;
      padding: 7px 12px;
      font-size: 0.84rem;
      font-weight: 700;
    }

    header {
      background: var(--black);
      color: var(--white);
      border-bottom: 1px solid rgba(223, 182, 63, 0.25);
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--white);
    }

    .logo-text-group {
      display: flex;
      flex-direction: column;
      line-height: 1.05;
    }

    .logo-main {
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--white);
    }

    .logo-sub {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--gold-bright);
      text-transform: uppercase;
    }

    .btn-gold {
      background: var(--gold-bright);
      color: var(--black);
      border: none;
      border-radius: 8px;
      padding: 11px 14px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-outline-gold {
      background: transparent;
      color: var(--gold-bright);
      border: 1px solid var(--gold);
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 700;
      font-size: 0.84rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .hero {
      position: relative;
      min-height: 230px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, rgba(10,10,12,0.28) 0%, rgba(10,10,12,0.42) 100%),
                  url("https://images.unsplash.com/photo-1549298916-b41d501d3772?auto=format&fit=crop&w=1200&q=85") center/cover no-repeat;
      filter: brightness(1.12) contrast(1.04);
      color: var(--white);
      padding: 48px 18px;
      text-align: center;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(2.1rem, 6.5vw, 3.2rem);
      font-weight: 900;
      color: var(--gold-bright);
      line-height: 1.08;
      text-shadow: 0 3px 16px rgba(0, 0, 0, 0.78);
    }

    .container { max-width: 1120px; margin: 0 auto; padding: 24px 16px; }

    .admin-panel {
      display: none;
      background: var(--black-2);
      color: var(--white);
      border: 1.5px solid var(--gold);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .admin-panel.open { display: block; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--gold-bright);
      margin-bottom: 4px;
    }

    input, select, textarea {
      width: 100%;
      border-radius: 8px;
      border: 1px solid #d0d0d8;
      padding: 9px 11px;
      font-size: 0.9rem;
      background: var(--white);
      color: var(--text-dark);
    }

    .admin-panel input,
    .admin-panel select,
    .admin-panel textarea {
      background: var(--black-3);
      color: var(--white);
      border-color: var(--border-dark);
    }

    .gallery-picker-box {
      border: 1.5px dashed var(--gold);
      border-radius: 12px;
      padding: 14px;
      background: rgba(242, 203, 75, 0.06);
      text-align: center;
    }

    .preview-strip {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
      justify-content: center;
    }

    .preview-strip img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 8px;
      border: 1.5px solid var(--gold);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .section-title { margin: 0; font-size: 1.35rem; font-weight: 800; color: var(--black); }
    .search-box { max-width: 280px; width: 100%; }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(305px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--white);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #e4e4ea;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
    }

    .gallery { background: var(--black); padding: 10px; position: relative; }

    .card-top-actions {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 6px;
    }

    .edit-prod-btn {
      background: rgba(10,10,12,0.86);
      color: var(--gold-bright);
      border: 1px solid var(--gold);
      border-radius: 8px;
      padding: 4px 9px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .delete-prod-btn {
      background: rgba(10,10,12,0.86);
      color: #fca5a5;
      border: 1px solid #ef4444;
      border-radius: 8px;
      padding: 4px 9px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .main-img {
      width: 100%;
      height: 235px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
      background: var(--black-2);
    }

    .thumbs { display: flex; gap: 8px; margin-top: 8px; overflow-x: auto; }

    .thumb {
      width: 56px;
      height: 56px;
      flex: 0 0 56px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid transparent;
      padding: 0;
      background: var(--black-2);
      cursor: pointer;
    }

    .thumb.active { border-color: var(--gold-bright); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .video-row { margin-top: 8px; font-size: 0.84rem; }
    .video-row a { color: var(--gold-bright); font-weight: 700; text-decoration: underline; }

    .card-body { padding: 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .prod-name { margin: 0; font-size: 1.12rem; font-weight: 800; color: var(--black); }
    .prod-desc { margin: 0; font-size: 0.88rem; color: var(--text-muted); }
    .prod-price { font-size: 1.35rem; font-weight: 900; }
    .prod-price span { background: var(--gold); color: var(--black); padding: 2px 8px; border-radius: 6px; }

    .variants-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .variants-row label {
      color: var(--text-dark);
      font-size: 0.78rem;
      margin-bottom: 3px;
    }

    .variants-row select { padding: 8px; font-size: 0.84rem; }

    .freight-box {
      background: #faf8f2;
      border: 1px solid #eadc9f;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .freight-controls { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; }
    .freight-controls input, .freight-controls select { padding: 8px; font-size: 0.84rem; }
    .freight-result { font-size: 0.84rem; font-weight: 600; color: var(--black); min-height: 18px; }

    .btn-dark {
      background: var(--black);
      color: var(--gold-bright);
      border: 1px solid var(--black);
      border-radius: 8px;
      padding: 9px 11px;
      font-weight: 700;
      font-size: 0.84rem;
      cursor: pointer;
    }

    .card-actions { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }

    .mp-badge {
      font-size: 0.75rem;
      color: #0369a1;
      font-weight: 700;
      text-align: center;
      background: #e0f2fe;
      padding: 5px 8px;
      border-radius: 6px;
    }

    .link-wa-subtle {
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      text-decoration: underline;
      padding-top: 2px;
    }

    .contact-banner {
      margin-top: 32px;
      background: var(--black-2);
      color: var(--white);
      border: 1px solid rgba(223, 182, 63, 0.35);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .contact-banner h3 { margin: 0; color: var(--gold-bright); font-size: 1.15rem; }
    .contact-banner p { margin: 0; font-size: 0.88rem; color: #d4d4dc; max-width: 480px; }

    .btn-wa {
      background: var(--wa-green);
      color: #052e16;
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-weight: 800;
      font-size: 0.88rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .wa-float {
      position: fixed;
      right: 16px;
      bottom: 66px;
